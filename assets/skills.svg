    <text x="74" y="32" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">Next.js 16 (App Router)</text>
    <text x="74" y="50" fill="#bae6fd" font-size="11.5" class="font-sans">High-Performance Route Handlers &amp; API Gateways</text>
    <text x="74" y="66" fill="#38bdf8" font-size="10" font-weight="600" class="font-mono">⚡ Server Components • Turbopack</text>
  </g>

  <g transform="translate(445, 60)">
    <rect width="370" height="80" rx="10" fill="url(#cardGreen)" stroke="#22c55e" stroke-width="1.2"/>
