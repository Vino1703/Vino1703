      <text x="24" y="30" fill="#4ade80" font-size="18" text-anchor="middle">🐙</text>
    </g>
    <text x="74" y="32" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">Git &amp; Modern CI/CD</text>
    <text x="74" y="50" fill="#86efac" font-size="11.5" class="font-sans">Version Control, Automated Pipelines &amp; Deployments</text>
