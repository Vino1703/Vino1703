  <g transform="translate(35, 428)">
    <rect width="370" height="80" rx="10" fill="url(#cardCyan)" stroke="#06b6d4" stroke-width="1.2"/>
    <g transform="translate(16, 16)">
      <rect width="48" height="48" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="24" y="30" fill="#38bdf8" font-size="18" text-anchor="middle">🐳</text>
    </g>
    <text x="74" y="32" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">Docker &amp; Linux CLI</text>
    <text x="74" y="50" fill="#bae6fd" font-size="11.5" class="font-sans">Containerized Microservices, Shell Automation &amp; VPS</text>
    <text x="74" y="66" fill="#38bdf8" font-size="10" font-weight="600" class="font-mono">🐧 Ubuntu Server • Container Isolation</text>
  </g>

  <g transform="translate(445, 428)">
    <rect width="370" height="80" rx="10" fill="url(#cardGreen)" stroke="#22c55e" stroke-width="1.2"/>
    <g transform="translate(16, 16)">
