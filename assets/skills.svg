    <text x="22" y="10" fill="#f8fafc" font-size="16" font-weight="800" class="font-sans" letter-spacing="0.5">ENGINEERING, BACKEND ARCHITECTURE &amp; FULLSTACK MATRIX</text>
    <text x="780" y="10" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="end" class="font-mono">VINOTH KUMAR // STACK</text>
  </g>

  <!-- Row 1: Next.js 16 (Left) & TypeScript (Right) -->
  <g transform="translate(35, 60)">
    <rect width="370" height="80" rx="10" fill="url(#cardCyan)" stroke="#06b6d4" stroke-width="1.2"/>
    <g transform="translate(16, 16)">
