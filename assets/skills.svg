    <text x="74" y="50" fill="#86efac" font-size="11.5" class="font-sans">Asynchronous Microservices, Auth &amp; Rate Limiting</text>
    <text x="74" y="66" fill="#4ade80" font-size="10" font-weight="600" class="font-mono">🚀 Non-blocking I/O • RESTful APIs</text>
