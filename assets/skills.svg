    </g>
    <text x="74" y="32" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">PHP &amp; Modern OOP Services</text>
    <text x="74" y="50" fill="#bae6fd" font-size="11.5" class="font-sans">Enterprise Legacy Migrations &amp; Clean Refactoring</text>
    <text x="74" y="66" fill="#38bdf8" font-size="10" font-weight="600" class="font-mono">💎 Domain Design • Service Layers</text>
  </g>

  <g transform="translate(445, 244)">
    <rect width="370" height="80" rx="10" fill="url(#cardGreen)" stroke="#22c55e" stroke-width="1.2"/>
    <g transform="translate(16, 16)">
