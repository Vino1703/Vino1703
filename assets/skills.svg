    <text x="74" y="32" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">MySQL &amp; Relational Databases</text>
    <text x="74" y="50" fill="#86efac" font-size="11.5" class="font-sans">Index Optimization, Queries &amp; Data Transfers</text>
    <text x="74" y="66" fill="#4ade80" font-size="10" font-weight="600" class="font-mono">📊 ACID Transactions • Fast Indexing</text>
