      <text x="24" y="30" fill="#4ade80" font-size="18" text-anchor="middle">📄</text>
    </g>
    <text x="74" y="32" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">Puppeteer Headless PDF Engine</text>
    <text x="74" y="50" fill="#86efac" font-size="11.5" class="font-sans">Pixel-Perfect Automated Reporting &amp; HTML-to-PDF</text>
    <text x="74" y="66" fill="#4ade80" font-size="10" font-weight="600" class="font-mono">🖨️ Automated Headless Rendering</text>
  </g>

