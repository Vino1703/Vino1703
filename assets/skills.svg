    <text x="74" y="50" fill="#bae6fd" font-size="11.5" class="font-sans">In-Memory Data Stores, Rate Limiting &amp; Fast Queues</text>
    <text x="74" y="66" fill="#38bdf8" font-size="10" font-weight="600" class="font-mono">⚡ Sub-Millisecond Speed • Pub/Sub</text>
  </g>

  <g transform="translate(445, 336)">
