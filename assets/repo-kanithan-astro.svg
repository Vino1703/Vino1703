<svg width="415" height="135" viewBox="0 0 415 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e">
        <animate attributeName="stop-color" values="#22c55e;#06b6d4;#22c55e" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>
  <rect width="415" height="135" rx="12" fill="#060c09" stroke="url(#kanBorder)" stroke-width="1.4"/>
  
  <g transform="translate(20, 28)">
    <text x="0" y="0" font-size="14">🪐</text>
    <text x="24" y="0" fill="#4ade80" font-size="15" font-weight="700" class="font-sans">Kanithan-Astro-Dev</text>
    <rect x="315" y="-14" width="55" height="20" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="0.8"/>
    <text x="342" y="0" fill="#86efac" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">Private</text>
  </g>

  <text x="20" y="58" fill="#94a3b8" font-size="11.5" class="font-sans">
    <tspan x="20" dy="0">Vedic astrology computing backend on Next.js 16,</tspan>
    <tspan x="20" dy="16">Prisma/Postgres, Swiss Ephemeris &amp; Puppeteer.</tspan>
  </text>

  <g transform="translate(20, 108)">
    <circle cx="5" cy="5" r="4" fill="#3178c6"/>
    <text x="16" y="9" fill="#93c5fd" font-size="11" class="font-mono">TypeScript / Next.js</text>
    <text x="200" y="9" fill="#4ade80" font-size="11" class="font-mono">★ Production</text>
  </g>
