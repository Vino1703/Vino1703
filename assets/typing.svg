    <text x="160" y="0" fill="#f8fafc" font-size="13" font-weight="500" class="font-mono">
      <tspan fill="#06b6d4">npx next</tspan> dev --turbopack &amp;&amp; <tspan fill="#4ade80">npx prisma</tspan> migrate deploy &amp;&amp; <tspan fill="#86efac">./deploy-cloud.sh</tspan>
    </text>
    <rect x="800" y="-12" width="8" height="15" class="cursor"/>
