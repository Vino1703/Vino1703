<svg width="850" height="350" viewBox="0 0 850 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="repoBg" x1="0" y1="0" x2="850" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060c09"/>
      <stop offset="100%" stop-color="#120a0c"/>
    </linearGradient>
    <linearGradient id="repoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e">
        <animate attributeName="stop-color" values="#22c55e;#06b6d4;#ef4444;#22c55e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#ef4444;#22c55e;#06b6d4" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', Consolas, monospace; }
    @keyframes glowPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .pulse-indicator { animation: glowPulse 2s infinite ease-in-out; }
  </style>

  <rect x="1" y="1" width="848" height="348" rx="16" fill="url(#repoBg)"/>
  <rect x="1" y="1" width="848" height="348" rx="16" stroke="url(#repoBorder)" stroke-width="1.6"/>

  <g transform="translate(35, 36)">
    <circle cx="6" cy="6" r="6" fill="#06b6d4" class="pulse-indicator"/>
    <text x="22" y="10" fill="#f8fafc" font-size="15" font-weight="800" class="font-sans">FEATURED PRODUCTION ARCHITECTURES &amp; REPOSITORIES</text>
    <text x="780" y="10" fill="#4ade80" font-size="12" font-weight="600" text-anchor="end" class="font-mono">Vino1703 // CODEBASE</text>
  </g>

  <!-- Card 1: enterprise-api-core -->
  <g transform="translate(35, 68)">
    <rect width="245" height="250" rx="12" fill="#0d1813" stroke="#22c55e" stroke-width="1.3"/>
    <circle cx="25" cy="28" r="10" fill="#052e16"/>
    <text x="25" y="32" fill="#4ade80" font-size="12" text-anchor="middle" class="font-mono">🚀</text>
    <text x="45" y="32" fill="#f8fafc" font-size="14.5" font-weight="700" class="font-sans">enterprise-api-core</text>
    
    <text x="20" y="66" fill="#94a3b8" font-size="11.5" class="font-sans">
      <tspan x="20" dy="0">High-concurrency Next.js 16</tspan>
      <tspan x="20" dy="16">API gateway with Prisma,</tspan>
      <tspan x="20" dy="16">Postgres, JWT rotation</tspan>
      <tspan x="20" dy="16">&amp; row-locked transactions.</tspan>
    </text>
    
    <g transform="translate(20, 160)">
      <rect width="90" height="22" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
      <text x="45" y="15" fill="#86efac" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">NEXT.JS 16</text>
    </g>
    <g transform="translate(120, 160)">
      <rect width="85" height="22" rx="6" fill="#1f2937"/>
      <text x="42" y="15" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">PRISMA</text>
    </g>

    <g transform="translate(20, 215)">
      <circle cx="6" cy="6" r="4" fill="#22c55e" class="pulse-indicator"/>
      <text x="18" y="10" fill="#4ade80" font-size="11" font-weight="600" class="font-mono">PRODUCTION // STABLE</text>
    </g>
  </g>

  <!-- Card 2: Vinoo-Blog -->
  <g transform="translate(300, 68)">
    <rect width="245" height="250" rx="12" fill="#081820" stroke="#06b6d4" stroke-width="1.3"/>
    <circle cx="25" cy="28" r="10" fill="#082f49"/>
    <text x="25" y="32" fill="#38bdf8" font-size="12" text-anchor="middle" class="font-mono">📝</text>
    <text x="45" y="32" fill="#f8fafc" font-size="14.5" font-weight="700" class="font-sans">Vinoo-Blog</text>
    
    <text x="20" y="66" fill="#94a3b8" font-size="11.5" class="font-sans">
      <tspan x="20" dy="0">Modern content publishing</tspan>
      <tspan x="20" dy="16">platform with dynamic</tspan>
      <tspan x="20" dy="16">rendering, responsive UI</tspan>
      <tspan x="20" dy="16">&amp; optimized web vitals.</tspan>
    </text>
    
    <g transform="translate(20, 160)">
      <rect width="90" height="22" rx="6" fill="#082f49" stroke="#06b6d4" stroke-width="1"/>
      <text x="45" y="15" fill="#7dd3fc" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">JAVASCRIPT</text>
    </g>
    <g transform="translate(120, 160)">
      <rect width="85" height="22" rx="6" fill="#1f2937"/>
      <text x="42" y="15" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">WEB ENGINE</text>
    </g>

    <g transform="translate(20, 215)">
      <circle cx="6" cy="6" r="4" fill="#06b6d4" class="pulse-indicator"/>
      <text x="18" y="10" fill="#38bdf8" font-size="11" font-weight="600" class="font-mono">LIVE // ACTIVE</text>
    </g>
  </g>

  <!-- Card 3: SHC-attendance -->
  <g transform="translate(565, 68)">
    <rect width="245" height="250" rx="12" fill="#0d1813" stroke="#22c55e" stroke-width="1.3"/>
    <circle cx="25" cy="28" r="10" fill="#052e16"/>
    <text x="25" y="32" fill="#4ade80" font-size="12" text-anchor="middle" class="font-mono">🎓</text>
    <text x="45" y="32" fill="#f8fafc" font-size="14.5" font-weight="700" class="font-sans">SHC-attendance</text>
    
    <text x="20" y="66" fill="#94a3b8" font-size="11.5" class="font-sans">
      <tspan x="20" dy="0">Digital academic attendance</tspan>
      <tspan x="20" dy="16">portal with role-based</tspan>
      <tspan x="20" dy="16">authentication, tracking</tspan>
      <tspan x="20" dy="16">&amp; data report exports.</tspan>
    </text>
    
    <g transform="translate(20, 160)">
      <rect width="90" height="22" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
      <text x="45" y="15" fill="#86efac" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">DATABASE</text>
    </g>
    <g transform="translate(120, 160)">
      <rect width="85" height="22" rx="6" fill="#1f2937"/>
      <text x="42" y="15" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">MANAGEMENT</text>
    </g>

    <g transform="translate(20, 215)">
      <circle cx="6" cy="6" r="4" fill="#22c55e" class="pulse-indicator"/>
      <text x="18" y="10" fill="#4ade80" font-size="11" font-weight="600" class="font-mono">PORTAL // STABLE</text>
    </g>
  </g>
</svg>