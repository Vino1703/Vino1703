<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statsBg" x1="0" y1="0" x2="850" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060c09"/>
      <stop offset="100%" stop-color="#14080a"/>
    </linearGradient>
    <linearGradient id="statsBorder" x1="0%" y1="0%" x2="850" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace; }
  </style>

  <rect x="1" y="1" width="848" height="218" rx="16" fill="url(#statsBg)"/>
  <rect x="1" y="1" width="848" height="218" rx="16" stroke="url(#statsBorder)" stroke-width="1.5"/>

  <g transform="translate(35, 35)">
    <circle cx="6" cy="6" r="6" fill="#22c55e"/>
    <text x="22" y="10" fill="#f8fafc" font-size="15" font-weight="800" class="font-sans">BACKEND &amp; SYSTEM PERFORMANCE TELEMETRY</text>
    <text x="780" y="10" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end" class="font-mono">VINOTH KUMAR</text>
  </g>

  <!-- 4 Telemetry Stats Boxes -->
  <g transform="translate(35, 65)">
    <rect width="180" height="120" rx="10" fill="#0d1813" stroke="#22c55e" stroke-width="1"/>
    <text x="20" y="32" fill="#86efac" font-size="11" font-weight="700" class="font-mono">API CONCURRENCY</text>
    <text x="20" y="75" fill="#f8fafc" font-size="32" font-weight="900" class="font-sans">10k+</text>
    <text x="20" y="100" fill="#22c55e" font-size="11" font-weight="600" class="font-mono">↑ High-Throughput</text>
  </g>

  <g transform="translate(235, 65)">
    <rect width="180" height="120" rx="10" fill="#081820" stroke="#06b6d4" stroke-width="1"/>
    <text x="20" y="32" fill="#7dd3fc" font-size="11" font-weight="700" class="font-mono">DB INTEGRITY</text>
    <text x="20" y="75" fill="#f8fafc" font-size="32" font-weight="900" class="font-sans">100%</text>
    <text x="20" y="100" fill="#38bdf8" font-size="11" font-weight="600" class="font-mono">↑ Row-Locked ACID</text>
  </g>

  <g transform="translate(435, 65)">
    <rect width="180" height="120" rx="10" fill="#0d1813" stroke="#22c55e" stroke-width="1"/>
    <text x="20" y="32" fill="#86efac" font-size="11" font-weight="700" class="font-mono">API LATENCY</text>
    <text x="20" y="75" fill="#f8fafc" font-size="32" font-weight="900" class="font-sans">&lt;50ms</text>
    <text x="20" y="100" fill="#22c55e" font-size="11" font-weight="600" class="font-mono">↑ High-Speed Engine</text>
  </g>

  <g transform="translate(635, 65)">
    <rect width="180" height="120" rx="10" fill="#081820" stroke="#06b6d4" stroke-width="1"/>
    <text x="20" y="32" fill="#7dd3fc" font-size="11" font-weight="700" class="font-mono">SYSTEM UPTIME</text>
    <text x="20" y="75" fill="#f8fafc" font-size="32" font-weight="900" class="font-sans">99.9%</text>
    <text x="20" y="100" fill="#38bdf8" font-size="11" font-weight="600" class="font-mono">Zero-Downtime SLA</text>
  </g>
</svg>