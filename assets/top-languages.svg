    </g>

    <g transform="translate(170, 0)">
      <circle cx="6" cy="6" r="5" fill="#f1e05a"/>
      <text x="18" y="10" fill="#f8fafc" font-size="12" font-weight="600" class="font-sans">JavaScript <tspan fill="#94a3b8">28.0%</tspan></text>
    </g>

    <g transform="translate(340, 0)">
