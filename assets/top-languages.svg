    <rect x="538" y="0" width="140" height="10" rx="5" fill="#4f5d95"/>
    <rect x="682" y="0" width="60" height="10" rx="5" fill="#3572A5"/>
    <rect x="746" y="0" width="34" height="10" rx="5" fill="#89e051"/>
  </g>

  <g transform="translate(35, 90)">
