      <stop offset="0%" stop-color="#22c55e">
        <animate attributeName="stop-color" values="#22c55e;#06b6d4;#22c55e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4"/>
